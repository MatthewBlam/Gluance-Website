<html lang="en">
  <head>

    <title>Gluance — Real-time Dexcom glucose on your Mac</title>
    <meta
      name="description"
      content="Gluance is a free, open-source macOS app for real-time Dexcom CGM readings — a menu bar readout and an always-on-top widget. Credentials stay Keychain-encrypted." />
    <meta name="keywords" content="Gluance, Dexcom, macOS, glucose monitor, CGM, menu bar, diabetes, open source, Mac app, real-time glucose" />
    <meta name="author" content="Matthew Blam" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://gluance.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gluance" />
    <meta property="og:title" content="Gluance — Real-Time Dexcom Glucose Readings on macOS" />
    <meta property="og:description" content="Free, open-source macOS app for real-time Dexcom CGM readings. Menu bar readout and always-on-top widget." />
    <meta property="og:image" content="https://gluance.com/og.png" />
    <meta property="og:url" content="https://gluance.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gluance — Real-Time Dexcom Glucose Readings on macOS" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Sets the theme before first paint so dark-mode visitors never see a light flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="m-0 p-0 bg-page text-app-text font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
